<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <title>Números</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
      .resultado {
        font-weight: bold;
        font-size: 6rem;
        text-align: center;
      }

      .canvas-container {
        margin: 0 auto;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="px-4 py-2 my-2 text-center border-bottom">
        <img class="d-block mx-auto mb-2" src="R.png" alt="Logo" width="80" height="80">
        <h1 class="display-5 fw-bold">N&uacute;meros escritos a mano</h1>
      </div>

      <div class="container mt-5">
        <div class="row">
          <div class="col-12 col-md-4 offset-md-4">
            <div id="canvas-container">
              <div><i>Dibuja el n&uacute;mero grande y centrado para tener una mejor predicci&oacute;n</i></div>
              <canvas id="bigcanvas" width="200" height="200"></canvas>
              <canvas id="smallcanvas" width="28" height="28" style="display: none"></canvas>
            </div>
            <div class="text-center mt-3">
              <button class="btn btn-primary" id="limpiar" onclick="limpiar()">Limpiar</button>
              <button class="btn btn-success" id="predecir" onclick="predecir()" disabled>Predecir</button>
              <div id="resultado" class="resultado"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.1/fabric.min.js"></script>

    <script src="drawing.js"></script>

    <script type="text/javascript">
      let modelo = null;
      let canvas = document.getElementById("bigcanvas");
      let ctx1 = canvas.getContext("2d");
      let smallcanvas = document.getElementById("smallcanvas");
      let ctx2 = smallcanvas.getContext("2d");

      drawingcanvas = new fabric.Canvas('bigcanvas', {
        isDrawingMode: true
      });

      function limpiar() {
        ctx1.clearRect(0, 0, canvas.width, canvas.height);
        drawingcanvas.clear();
      }

      function predecir() {
        resample_single(canvas, 28, 28, smallcanvas);
        let imgData = ctx2.getImageData(0, 0, 28, 28);
        let arr = [], arr28 = [];

        for (let p = 0, i = 0; p < imgData.data.length; p += 4) {
          let valor = imgData.data[p + 3] / 255;
          arr28.push([valor]);
          if (arr28.length === 28) {
            arr.push(arr28);
            arr28 = [];
          }
        }

        arr = [arr];
        let tensor4 = tf.tensor4d(arr);
        let resultados = modelo.predict(tensor4).dataSync();
        let mayorIndice = resultados.indexOf(Math.max(...resultados));

        console.log("Predicción:", mayorIndice);
        document.getElementById("resultado").innerHTML = mayorIndice;
      }

      function resample_single(canvas, width, height, resize_canvas) {
        let width_source = canvas.width;
        let height_source = canvas.height;
        width = Math.round(width);
        height = Math.round(height);

        let ratio_w = width_source / width;
        let ratio_h = height_source / height;
        let ratio_w_half = Math.ceil(ratio_w / 2);
        let ratio_h_half = Math.ceil(ratio_h / 2);

        let ctx = canvas.getContext("2d");
        let ctx2 = resize_canvas.getContext("2d");
        let img = ctx.getImageData(0, 0, width_source, height_source);
        let img2 = ctx2.createImageData(width, height);
        let data = img.data;
        let data2 = img2.data;

        for (let j = 0; j < height; j++) {
          for (let i = 0; i < width; i++) {
            let x2 = (i + j * width) * 4;
            let weight = 0, weights = 0, weights_alpha = 0;
            let gx_r = 0, gx_g = 0, gx_b = 0, gx_a = 0;
            let center_y = (j + 0.5) * ratio_h;
            let yy_start = Math.floor(j * ratio_h);
            let yy_stop = Math.ceil((j + 1) * ratio_h);
            for (let yy = yy_start; yy < yy_stop; yy++) {
              let dy = Math.abs(center_y - (yy + 0.5)) / ratio_h_half;
              let center_x = (i + 0.5) * ratio_w;
              let w0 = dy * dy;
              let xx_start = Math.floor(i * ratio_w);
              let xx_stop = Math.ceil((i + 1) * ratio_w);
              for (let xx = xx_start; xx < xx_stop; xx++) {
                let dx = Math.abs(center_x - (xx + 0.5)) / ratio_w_half;
                let w = Math.sqrt(w0 + dx * dx);
                if (w >= 1) continue;
                weight = 2 * w * w * w - 3 * w * w + 1;
                let pos_x = 4 * (xx + yy * width_source);
                gx_a += weight * data[pos_x + 3];
                weights_alpha += weight;
                if (data[pos_x + 3] < 255)
                  weight *= data[pos_x + 3] / 250;
                gx_r += weight * data[pos_x];
                gx_g += weight * data[pos_x + 1];
                gx_b += weight * data[pos_x + 2];
                weights += weight;
              }
            }
            data2[x2] = gx_r / weights;
            data2[x2 + 1] = gx_g / weights;
            data2[x2 + 2] = gx_b / weights;
            data2[x2 + 3] = gx_a / weights_alpha;
          }
        }

        for (let p = 0; p < data2.length; p += 4) {
          let gris = data2[p];
          gris = gris < 100 ? 0 : 255;
          data2[p] = gris;
          data2[p + 1] = gris;
          data2[p + 2] = gris;
        }

        ctx2.putImageData(img2, 0, 0);
      }

      // Cargar modelo
      (async () => {
        console.log("Cargando modelo...");
        modelo = await tf.loadLayersModel("./model.json");
        console.log("Modelo cargado...");
        document.getElementById("predecir").disabled = false;
      })();
    </script>
  </body>
</html>
